name: irent
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: irent
      POSTGRES_DB: irent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes:
      - /opt/irent/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irent -d irent"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: migrations
    env_file: /opt/irent/config/app.env
    depends_on:
      db:
        condition: service_healthy
    profiles: ["tools"]
    logging: *logging
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      target: runtime
    restart: unless-stopped
    env_file: /opt/irent/config/app.env
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - /opt/irent/data/proofs:/data/proofs
      - /opt/irent/data/media:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3030/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set application domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - /opt/irent/data/caddy:/data
      - /opt/irent/data/caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *logging
