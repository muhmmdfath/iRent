services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: irent
      POSTGRES_PASSWORD: irent_local
      POSTGRES_DB: irent
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - irent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U irent -d irent']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  irent_pgdata:
